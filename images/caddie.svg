<svg width="280" height="240" viewBox="0 0 280 240" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Sparkle lines top right -->
  <line x1="220" y1="55" x2="235" y2="45" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="228" y1="65" x2="246" y2="63" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
  <line x1="222" y1="75" x2="238" y2="82" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>

  <!-- Box / item in cart -->
  <rect x="130" y="52" width="82" height="58" rx="6" fill="#C8C84A" stroke="#1a1a2e" stroke-width="4"/>

  <!-- Cart body -->
  <path d="M55 80 L75 80 L100 155 L210 155 L230 95 L80 95"
        stroke="#1a1a2e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Cart bottom -->
  <path d="M100 155 Q100 165 108 165 L205 165 Q212 165 213 158"
        stroke="#1a1a2e" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Cart handle area (left lines) -->
  <line x1="105" y1="115" x2="175" y2="115" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round"/>
  <line x1="110" y1="132" x2="172" y2="132" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round"/>

  <!-- Handle bar -->
  <line x1="30" y1="68" x2="75" y2="68" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round"/>
  <line x1="55" y1="68" x2="55" y2="82" stroke="#1a1a2e" stroke-width="6" stroke-linecap="round"/>

  <!-- Left wheel -->
  <circle cx="125" cy="182" r="18" fill="#C8C84A" stroke="#1a1a2e" stroke-width="5"/>
  <circle cx="125" cy="182" r="6" fill="#1a1a2e"/>

  <!-- Right wheel -->
  <circle cx="195" cy="182" r="18" fill="#C8C84A" stroke="#1a1a2e" stroke-width="5"/>
  <circle cx="195" cy="182" r="6" fill="#1a1a2e"/>

  <!-- Ground line -->
  <line x1="90" y1="204" x2="240" y2="204" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>

</svg>
